<div class="artifact-header">
  <div class="artifact-icon">🧬</div>
  <div>
    <div class="artifact-title">Mapa corporal</div>
    <div class="artifact-sub">Registro de lesiones dérmicas</div>
  </div>
</div>

<style>
body { background:transparent; margin:0; padding:12px; font-family:system-ui,sans-serif; }
.artifact-header { display:flex; align-items:center; gap:8px; margin-bottom:14px; padding-bottom:12px; border-bottom:0.5px solid var(--color-border-tertiary); }
.artifact-icon { width:32px; height:32px; border-radius:8px; background:var(--color-background-secondary); display:flex; align-items:center; justify-content:center; font-size:17px; }
.artifact-title { font-size:14px; font-weight:500; color:var(--color-text-primary); }
.artifact-sub { font-size:11px; color:var(--color-text-tertiary); margin-top:1px; }
.body-wrap{padding:0;display:flex;flex-direction:column;align-items:center}
.body-views{display:flex;gap:20px;justify-content:center;margin-bottom:10px}
.view-label{font-size:10px;color:var(--color-text-tertiary);text-align:center;margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em}
.body-svg{width:130px}
.zone{cursor:pointer;transition:opacity 0.15s;fill:#D3D1C7;stroke:#B4A88A;stroke-width:0.8}
.zone:hover{opacity:0.7}
.legend{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin:8px 0}
.leg-item{display:flex;align-items:center;gap:3px;font-size:10px;color:var(--color-text-secondary)}
.leg-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.info-panel{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:10px 14px;margin-top:10px;font-size:12px;color:var(--color-text-secondary);text-align:center;width:100%;max-width:320px}
.lesion-btns{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin:10px 0;max-width:320px}
.lesion-btn{font-size:10px;padding:4px 10px;border-radius:6px;border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);color:var(--color-text-secondary);cursor:pointer;transition:all .15s}
.lesion-btn:hover{background:var(--color-background-secondary)}
.lesion-btn.active{color:#fff;border-color:transparent}
.zones-list{margin-top:10px;width:100%;max-width:320px}
.zone-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:0.5px solid var(--color-border-tertiary);font-size:12px;color:var(--color-text-primary)}
.zone-badge{font-size:10px;padding:2px 8px;border-radius:6px;color:#fff}
</style>

<div class="body-wrap">
  <div class="legend">
    <div class="leg-item"><div class="leg-dot" style="background:#D3D1C7"></div>Sin lesión</div>
    <div class="leg-item"><div class="leg-dot" style="background:#F7C1C1"></div>Eritema</div>
    <div class="leg-item"><div class="leg-dot" style="background:#FAC775"></div>Pápula</div>
    <div class="leg-item"><div class="leg-dot" style="background:#F4C0D1"></div>Mancha</div>
    <div class="leg-item"><div class="leg-dot" style="background:#CCC;border:1.5px solid #A32D2D"></div>Úlcera</div>
  </div>

  <div class="body-views">
    <div>
      <div class="view-label">Anterior</div>
      <svg class="body-svg" viewBox="0 0 130 280" xmlns="http://www.w3.org/2000/svg">
        <path id="f-head"    class="zone" d="M48,8 C48,-2 82,-2 82,8 C82,22 78,32 74,38 C70,43 60,43 56,38 C52,32 48,22 48,8 Z" onclick="selectZone('Cabeza')"/>
        <path id="f-neck"    class="zone" d="M56,38 L74,38 L72,50 L58,50 Z" onclick="selectZone('Cuello')"/>
        <path id="f-torso"   class="zone" d="M34,50 C26,52 22,60 22,72 C22,88 28,104 30,114 C32,122 30,128 30,132 L100,132 C100,128 98,122 100,114 C102,104 108,88 108,72 C108,60 104,52 96,50 Z" onclick="selectZone('Torso anterior')"/>
        <path id="f-larm"    class="zone" d="M32,50 C16,52 10,62 10,78 C10,94 12,110 14,120 C16,123 22,123 24,120 C22,110 20,94 20,78 C20,66 24,56 32,50 Z" onclick="selectZone('Brazo izquierdo')"/>
        <path id="f-rarm"    class="zone" d="M98,50 C114,52 120,62 120,78 C120,94 118,110 116,120 C114,123 108,123 106,120 C108,110 110,94 110,78 C110,66 106,56 98,50 Z" onclick="selectZone('Brazo derecho')"/>
        <path id="f-lhand"   class="zone" d="M8,120 C4,126 4,132 7,135 C11,138 16,136 18,131 C15,129 12,126 12,120 Z" onclick="selectZone('Mano izquierda')"/>
        <path id="f-rhand"   class="zone" d="M122,120 C126,126 126,132 123,135 C119,138 114,136 112,131 C115,129 118,126 118,120 Z" onclick="selectZone('Mano derecha')"/>
        <path id="f-pelvis"  class="zone" d="M28,132 C24,142 24,154 28,158 L102,158 C106,154 106,142 102,132 Z" onclick="selectZone('Pelvis')"/>
        <path id="f-lleg"    class="zone" d="M34,158 C30,184 28,214 30,244 C34,248 46,248 52,244 C54,214 52,184 48,158 Z" onclick="selectZone('Pierna izquierda')"/>
        <path id="f-rleg"    class="zone" d="M96,158 C100,184 102,214 100,244 C96,248 84,248 78,244 C76,214 78,184 82,158 Z" onclick="selectZone('Pierna derecha')"/>
        <path id="f-lfoot"   class="zone" d="M24,244 C20,252 22,258 30,260 L54,258 C56,254 54,250 50,244 Z" onclick="selectZone('Pie izquierdo')"/>
        <path id="f-rfoot"   class="zone" d="M106,244 C110,252 108,258 100,260 L76,258 C74,254 76,250 80,244 Z" onclick="selectZone('Pie derecho')"/>
      </svg>
    </div>
    <div>
      <div class="view-label">Posterior</div>
      <svg class="body-svg" viewBox="0 0 130 280" xmlns="http://www.w3.org/2000/svg">
        <path id="b-head"    class="zone" d="M48,8 C48,-2 82,-2 82,8 C82,22 78,32 74,38 C70,43 60,43 56,38 C52,32 48,22 48,8 Z" onclick="selectZone('Cabeza posterior')"/>
        <path id="b-neck"    class="zone" d="M56,38 L74,38 L72,50 L58,50 Z" onclick="selectZone('Nuca')"/>
        <path id="b-back"    class="zone" d="M34,50 C26,52 22,60 22,72 C22,88 28,104 30,114 C32,122 30,128 30,132 L100,132 C100,128 98,122 100,114 C102,104 108,88 108,72 C108,60 104,52 96,50 Z" onclick="selectZone('Espalda')"/>
        <path id="b-larm"    class="zone" d="M32,50 C16,52 10,62 10,78 C10,94 12,110 14,120 C16,123 22,123 24,120 C22,110 20,94 20,78 C20,66 24,56 32,50 Z" onclick="selectZone('Hombro izquierdo')"/>
        <path id="b-rarm"    class="zone" d="M98,50 C114,52 120,62 120,78 C120,94 118,110 116,120 C114,123 108,123 106,120 C108,110 110,94 110,78 C110,66 106,56 98,50 Z" onclick="selectZone('Hombro derecho')"/>
        <path id="b-glut"    class="zone" d="M28,132 C22,152 26,168 42,172 C52,174 78,174 88,172 C104,168 108,152 102,132 Z" onclick="selectZone('Glúteos')"/>
        <path id="b-lleg"    class="zone" d="M34,158 C30,184 28,214 30,244 C34,248 46,248 52,244 C54,214 52,184 48,158 Z" onclick="selectZone('Pantorrilla izquierda')"/>
        <path id="b-rleg"    class="zone" d="M96,158 C100,184 102,214 100,244 C96,248 84,248 78,244 C76,214 78,184 82,158 Z" onclick="selectZone('Pantorrilla derecha')"/>
        <path id="b-lfoot"   class="zone" d="M24,244 C20,252 22,258 30,260 L54,258 C56,254 54,250 50,244 Z" onclick="selectZone('Talón izquierdo')"/>
        <path id="b-rfoot"   class="zone" d="M106,244 C110,252 108,258 100,260 L76,258 C74,254 76,250 80,244 Z" onclick="selectZone('Talón derecho')"/>
      </svg>
    </div>
  </div>

  <div class="info-panel" id="info-panel">Tocá una zona del cuerpo para registrar una lesión</div>

  <div class="lesion-btns" id="lesion-btns" style="display:none">
    <button class="lesion-btn" data-type="eritema" data-color="#A32D2D" data-fill="#F7C1C1">Eritema</button>
    <button class="lesion-btn" data-type="papula" data-color="#854F0B" data-fill="#FAC775">Pápula</button>
    <button class="lesion-btn" data-type="mancha" data-color="#993556" data-fill="#F4C0D1">Mancha</button>
    <button class="lesion-btn" data-type="ulcera" data-color="#A32D2D" data-fill="#D3D1C7">Úlcera</button>
    <button class="lesion-btn" data-type="ninguna" data-color="#5F5E5A" data-fill="#D3D1C7">Sin lesión</button>
  </div>

  <div class="zones-list" id="zones-list"></div>
</div>

<script>
const zoneData = {};
let selZone = null;

const LESION = {
  eritema: {label:'Eritema', color:'#A32D2D', fill:'#F7C1C1'},
  papula:  {label:'Pápula', color:'#854F0B', fill:'#FAC775'},
  mancha:  {label:'Mancha', color:'#993556', fill:'#F4C0D1'},
  ulcera:  {label:'Úlcera', color:'#A32D2D', fill:'#D3D1C7'},
  ninguna: {label:'Sin lesión', color:'#5F5E5A', fill:'#D3D1C7'},
};

const zoneToIds = {
  'Cabeza': ['f-head'], 'Cuello': ['f-neck'], 'Torso anterior': ['f-torso'],
  'Brazo izquierdo': ['f-larm'], 'Brazo derecho': ['f-rarm'],
  'Mano izquierda': ['f-lhand'], 'Mano derecha': ['f-rhand'],
  'Pelvis': ['f-pelvis'],
  'Pierna izquierda': ['f-lleg'], 'Pierna derecha': ['f-rleg'],
  'Pie izquierdo': ['f-lfoot'], 'Pie derecho': ['f-rfoot'],
  'Cabeza posterior': ['b-head'], 'Nuca': ['b-neck'], 'Espalda': ['b-back'],
  'Hombro izquierdo': ['b-larm'], 'Hombro derecho': ['b-rarm'],
  'Glúteos': ['b-glut'],
  'Pantorrilla izquierda': ['b-lleg'], 'Pantorrilla derecha': ['b-rleg'],
  'Talón izquierdo': ['b-lfoot'], 'Talón derecho': ['b-rfoot'],
};

function selectZone(name) {
  selZone = name;
  const cur = zoneData[name];
  document.getElementById('info-panel').innerHTML = cur
    ? `<strong>${name}</strong> — <span style="color:${LESION[cur].color};font-weight:500">${LESION[cur].label}</span>`
    : `<strong>${name}</strong> — Sin lesión registrada`;
  const btns = document.getElementById('lesion-btns');
  btns.style.display = 'flex';
  btns.querySelectorAll('.lesion-btn').forEach(b => {
    const active = zoneData[name] === b.dataset.type;
    b.className = 'lesion-btn' + (active ? ' active' : '');
    b.style.background = active ? b.dataset.color : '';
    b.style.borderColor = active ? b.dataset.color : '';
    b.style.color = active ? '#fff' : '';
  });
}

document.getElementById('lesion-btns').addEventListener('click', e => {
  const btn = e.target.closest('.lesion-btn');
  if (!btn || !selZone) return;
  const type = btn.dataset.type;
  if (type === 'ninguna') { delete zoneData[selZone]; }
  else { zoneData[selZone] = type; }
  const ids = zoneToIds[selZone] || [];
  const l = type === 'ninguna' ? LESION.ninguna : LESION[type];
  ids.forEach(id => { const el = document.getElementById(id); if (el) el.setAttribute('fill', l.fill); });
  selectZone(selZone);
  renderList();
});

function renderList() {
  const list = document.getElementById('zones-list');
  const entries = Object.entries(zoneData);
  if (!entries.length) { list.innerHTML = ''; return; }
  list.innerHTML = '<div class="section-title">Lesiones registradas</div>' +
    entries.map(([z, t]) =>
      `<div class="zone-row"><span>${z}</span><span class="zone-badge" style="background:${LESION[t].color}">${LESION[t].label}</span></div>`
    ).join('');
}

function loadState(data) {
  if (data?.zoneData) {
    Object.assign(zoneData, data.zoneData);
    Object.entries(zoneData).forEach(([z, t]) => {
      const ids = zoneToIds[z] || [];
      ids.forEach(id => { const el = document.getElementById(id); if (el) el.setAttribute('fill', LESION[t].fill); });
    });
    renderList();
  }
}
window.getState = function() { return { zoneData: zoneData }; };

window.addEventListener('message', function(e) {
  if (e.data?.type === 'artifact:theme' && e.data?.variables) {
    Object.entries(e.data.variables).forEach(([key, val]) => {
      document.documentElement.style.setProperty(key, val);
    });
  }
});
</script>
