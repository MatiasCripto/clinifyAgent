<div class="artifact-header">

<style>
body { background:transparent; margin:0; padding:12px; font-family:system-ui,sans-serif; }
.artifact-header { display:flex; align-items:center; gap:8px; margin-bottom:14px; padding-bottom:12px; border-bottom:0.5px solid var(--color-border-tertiary); }
.artifact-icon { width:32px; height:32px; border-radius:8px; background:var(--color-background-secondary); display:flex; align-items:center; justify-content:center; font-size:17px; }
.artifact-title { font-size:14px; font-weight:500; color:var(--color-text-primary); }
.artifact-sub { font-size:11px; color:var(--color-text-tertiary); margin-top:1px; }
.trau-wrap{display:flex;flex-direction:column;align-items:center}
.legend{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin:8px 0}
.leg-item{display:flex;align-items:center;gap:3px;font-size:10px;color:var(--color-text-secondary)}
.leg-dot{width:9px;height:9px;border-radius:50%}
.bone{cursor:pointer;transition:opacity 0.15s;fill:#E8DFD0;stroke:#B4A88A;stroke-width:0.8}
.bone:hover{opacity:0.6}
.trau-info{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:10px 14px;margin-top:10px;font-size:12px;color:var(--color-text-secondary);text-align:center;width:100%;max-width:300px}
.diag-btns{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin:10px 0;max-width:300px}
.diag-btn{font-size:10px;padding:4px 10px;border-radius:6px;border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);color:var(--color-text-secondary);cursor:pointer}
.diag-btn:hover{background:var(--color-background-secondary)}
.diag-btn.active{color:#fff;border-color:transparent}
.bone-list{margin-top:10px;width:100%;max-width:300px}
.bone-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:0.5px solid var(--color-border-tertiary);font-size:12px;color:var(--color-text-primary)}
.bone-badge{font-size:10px;padding:2px 8px;border-radius:6px;color:#fff}
</style>

<script>
const boneData = {};
const DIAG = {
  fractura:{label:'Fractura',color:'#A32D2D',fill:'#F7C1C1'},
  esguince:{label:'Esguince',color:'#854F0B',fill:'#FAC775'},
  luxacion:{label:'Luxación',color:'#185FA5',fill:'#B5D4F4'},
  inflamacion:{label:'Inflamación',color:'#993556',fill:'#F4C0D1'},
  normal:{label:'Normal',color:'#5F5E5A',fill:'#E8DFD0'},
};
const boneToId = {
  'Cráneo':'b-skull','Mandíbula':'b-mandible','Columna cervical':'b-spine-c',
  'Clavícula izquierda':'b-clavicle-l','Clavícula derecha':'b-clavicle-r',
  'Esternón':'b-sternum','Columna torácica':'b-spine-t',
  'Costillas izquierdas':'b-ribs-l','Costillas derechas':'b-ribs-r',
  'Húmero izquierdo':'b-humerus-l','Húmero derecho':'b-humerus-r',
  'Radio izquierdo':'b-radius-l','Cúbito izquierdo':'b-ulna-l',
  'Radio derecho':'b-radius-r','Cúbito derecho':'b-ulna-r',
  'Mano izquierda':'b-hand-l','Mano derecha':'b-hand-r',
  'Columna lumbar':'b-spine-l','Pelvis':'b-pelvis',
  'Fémur izquierdo':'b-femur-l','Fémur derecho':'b-femur-r',
  'Rodilla izquierda':'b-knee-l','Rodilla derecha':'b-knee-r',
  'Tibia izquierda':'b-tibia-l','Tibia derecha':'b-tibia-r',
  'Pie izquierdo':'b-foot-l','Pie derecho':'b-foot-r',
};
let selBone = null;
function selectBone(name){
  selBone = name;
  const cur = boneData[name];
  document.getElementById('trau-info').innerHTML = cur
    ? `<strong>${name}</strong> — <span style="color:${DIAG[cur].color};font-weight:500">${DIAG[cur].label}</span>`
    : `<strong>${name}</strong> — Sin diagnóstico registrado`;
  const btns = document.getElementById('diag-btns');
  btns.style.display = 'flex';
  btns.querySelectorAll('.diag-btn').forEach(b => {
    const active = boneData[name] === b.dataset.diag;
    b.className = 'diag-btn' + (active ? ' active' : '');
    b.style.background = active ? b.dataset.color : '';
    b.style.borderColor = active ? b.dataset.color : '';
    b.style.color = active ? '#fff' : '';
  });
}
document.getElementById('diag-btns').addEventListener('click', e => {
  const btn = e.target.closest('.diag-btn');
  if (!btn || !selBone) return;
  const d = btn.dataset.diag;
  if (d === 'normal') delete boneData[selBone];
  else boneData[selBone] = d;
  const el = document.getElementById(boneToId[selBone]);
  if (el) el.setAttribute('fill', DIAG[d].fill);
  selectBone(selBone); renderList();
});
function renderList(){
  const list = document.getElementById('bone-list');
  const entries = Object.entries(boneData);
  if (!entries.length) { list.innerHTML = ''; return; }
  list.innerHTML = '<div class="section-title">Diagnósticos registrados</div>' +
    entries.map(([b,d]) => `<div class="bone-row"><span>${b}</span><span class="bone-badge" style="background:${DIAG[d].color}">${DIAG[d].label}</span></div>`).join('');
}
function loadState(data) {
  if (data?.boneData) {
    Object.assign(boneData, data.boneData);
    Object.entries(boneData).forEach(([b, d]) => { const el = document.getElementById(boneToId[b]); if(el) el.setAttribute('fill', DIAG[d].fill); });
    renderList();
  }
}
window.getState = function() { return { boneData: boneData }; };

window.addEventListener('message', function(e) {
  if (e.data?.type === 'artifact:theme' && e.data?.variables) {
    Object.entries(e.data.variables).forEach(([key, val]) => { document.documentElement.style.setProperty(key, val); });
  }
});
</script>
