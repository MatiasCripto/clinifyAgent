<div class="artifact-header">
  <div class="artifact-icon">🦷</div>
  <div>
    <div class="artifact-title">Odontograma</div>
    <div class="artifact-sub">Registro clínico · Numeración FDI</div>
  </div>
</div>

<style>
body { background: transparent; margin: 0; padding: 12px; font-family: system-ui, sans-serif; }
.artifact-header { display:flex; align-items:center; gap:8px; margin-bottom:14px; padding-bottom:12px; border-bottom:0.5px solid var(--color-border-tertiary); }
.artifact-icon { width:32px; height:32px; border-radius:8px; background:var(--color-background-secondary); display:flex; align-items:center; justify-content:center; font-size:17px; }
.artifact-title { font-size:14px; font-weight:500; color:var(--color-text-primary); }
.artifact-sub { font-size:11px; color:var(--color-text-tertiary); margin-top:1px; }
.odo-wrap{width:100%}
.legend{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-bottom:10px}
.leg-item{display:flex;align-items:center;gap:3px;font-size:10px;color:var(--color-text-secondary)}
.leg-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.arch-label{font-size:10px;color:var(--color-text-tertiary);text-align:center;margin:6px 0 4px;text-transform:uppercase;letter-spacing:.04em}
.odo-row{display:flex;justify-content:center;gap:2px;margin-bottom:2px}
.tooth-wrap{display:flex;flex-direction:column;align-items:center;cursor:pointer;position:relative}
.tooth-num{font-size:8px;color:var(--color-text-tertiary);line-height:1;margin:1px 0}
.tooth-svg{width:22px;height:32px;transition:transform .15s}
.tooth-wrap:hover .tooth-svg{transform:scale(1.12);z-index:2}
.odo-divider{height:0.5px;background:var(--color-border-tertiary);margin:6px 0}
.sel-panel{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:10px 14px;margin-top:10px;text-align:center}
.sel-info{font-size:12px;color:var(--color-text-secondary);margin-bottom:8px}
.state-btns{display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
.summary{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px;padding:8px 12px;background:var(--color-background-secondary);border-radius:var(--border-radius-md)}
.sum-item{font-size:10px;display:flex;align-items:center;gap:3px;color:var(--color-text-secondary)}
.sum-num{font-weight:600;min-width:14px;text-align:center}
</style>

<div class="legenda">
  <div class="legend">
    <div class="leg-item"><div class="leg-dot" style="background:#B5D4F4"></div>Sano</div>
    <div class="leg-item"><div class="leg-dot" style="background:#F7C1C1"></div>Caries</div>
    <div class="leg-item"><div class="leg-dot" style="background:#FAC775"></div>Obturado</div>
    <div class="leg-item"><div class="leg-dot" style="background:#C0DD97"></div>Corona</div>
    <div class="leg-item"><div class="leg-dot" style="background:#CCC"></div>Ausente</div>
    <div class="leg-item"><div class="leg-dot" style="background:#F4C0D1"></div>Extraer</div>
  </div>
</div>

<div class="arch-label">Superiores</div>
<div class="odo-row" id="row-top"></div>
<div class="odo-divider"></div>
<div class="odo-row" id="row-bot"></div>
<div class="arch-label">Inferiores</div>

<div class="sel-panel">
  <div class="sel-info" id="sel-info">Tocá un diente para ver o modificar su estado</div>
  <div class="state-btns" id="state-btns" style="display:none">
    <button class="state-btn" data-state="sano" style="color:#185FA5;border-color:#B5D4F4">Sano</button>
    <button class="state-btn" data-state="caries" style="color:#A32D2D;border-color:#F7C1C1">Caries</button>
    <button class="state-btn" data-state="obturado" style="color:#854F0B;border-color:#FAC775">Obturado</button>
    <button class="state-btn" data-state="corona" style="color:#3B6D11;border-color:#C0DD97">Corona</button>
    <button class="state-btn" data-state="ausente" style="color:#5F5E5A;border-color:#CCC">Ausente</button>
    <button class="state-btn" data-state="extraer" style="color:#993556;border-color:#F4C0D1">Extraer</button>
  </div>
</div>

<div class="summary" id="summary"></div>

<script>
const STATES = {
  sano:     {fill:'#B5D4F4', stroke:'#378ADD', label:'Sano',     color:'#185FA5'},
  caries:   {fill:'#F7C1C1', stroke:'#E24B4A', label:'Caries',   color:'#A32D2D'},
  obturado: {fill:'#FAC775', stroke:'#EF9F27', label:'Obturado', color:'#854F0B'},
  corona:   {fill:'#C0DD97', stroke:'#639922', label:'Corona',   color:'#3B6D11'},
  ausente:  {fill:'#D3D1C7', stroke:'#888780', label:'Ausente',  color:'#5F5E5A'},
  extraer:  {fill:'#F4C0D1', stroke:'#D4537E', label:'Extraer',  color:'#993556'},
};

const topNums = [18,17,16,15,14,13,12,11,21,22,23,24,25,26,27,28];
const botNums = [48,47,46,45,44,43,42,41,31,32,33,34,35,36,37,38];
const teeth = {};
topNums.forEach(n => teeth[n] = 'sano');
botNums.forEach(n => teeth[n] = 'sano');
let selected = null;

function getToothType(num) {
  const n = num % 10;
  if (num >= 11 && num <= 18) {
    if (n <= 2) return 'incisor';
    if (n === 3) return 'canine';
    if (n <= 5) return 'premolar';
    return 'molar';
  }
  if (num >= 21 && num <= 28) {
    if (n <= 2) return 'incisor';
    if (n === 3) return 'canine';
    if (n <= 5) return 'premolar';
    return 'molar';
  }
  if (num >= 31 && num <= 38) {
    if (n <= 2) return 'incisor';
    if (n === 3) return 'canine';
    if (n <= 5) return 'premolar';
    return 'molar';
  }
  if (num >= 41 && num <= 48) {
    if (n <= 2) return 'incisor';
    if (n === 3) return 'canine';
    if (n <= 5) return 'premolar';
    return 'molar';
  }
  return 'molar';
}
function isUpper(num) { return (num >= 11 && num <= 18) || (num >= 21 && num <= 28); }

const TOOTH_PATHS = {
  // Crown at top, root at bottom. Upper teeth get flipped via SVG transform.
  incisor: "M6,2 L18,2 Q18,10 16,14 Q14,24 12,32 Q10,24 8,14 Q6,10 6,2 Z",
  canine:  "M2,4 L12,0 L22,4 Q22,10 19,14 Q16,24 12,32 Q8,24 5,14 Q2,10 2,4 Z",
  premolar:"M2,1 L2,5 Q6,6 8,4 L16,4 Q18,6 22,5 L22,1 Q22,10 19,14 Q16,24 12,32 Q8,24 5,14 Q2,10 2,1 Z",
  molar:   "M1,2 L1,6 Q5,7 7,5 Q9,8 12,6 Q15,8 17,5 Q19,7 23,6 L23,2 Q23,10 20,14 Q17,24 12,32 Q7,24 4,14 Q1,10 1,2 Z"
};

function toothSVG(num) {
  const s = STATES[teeth[num]];
  const type = getToothType(num);
  const upper = isUpper(num);
  const path = TOOTH_PATHS[type];

  let inner;
  if (teeth[num] === 'ausente') {
    inner = `<line x1="4" y1="4" x2="20" y2="28" stroke="${s.stroke}" stroke-width="1.5" stroke-linecap="round"/>
             <line x1="20" y1="4" x2="4" y2="28" stroke="${s.stroke}" stroke-width="1.5" stroke-linecap="round"/>`;
  } else {
    const flip = upper ? ' transform="translate(0,34) scale(1,-1)"' : '';
    inner = `<path d="${path}" fill="${s.fill}" stroke="${s.stroke}" stroke-width="1.2"${flip}/>`;
  }

  const selMark = selected === num
    ? `<rect x="0" y="0" width="24" height="34" rx="4" fill="none" stroke="#7C3AED" stroke-width="2"/>`
    : '';

  return `<svg class="tooth-svg" viewBox="0 0 24 34" xmlns="http://www.w3.org/2000/svg">${inner}${selMark}</svg>`;
}

function renderRow(rowId, nums) {
  document.getElementById(rowId).innerHTML = nums.map(n =>
    `<div class="tooth-wrap" onclick="selectTooth(${n})">
      <div class="tooth-num">${n}</div>
      ${toothSVG(n)}
    </div>`
  ).join('');
}

function renderAll() { renderRow('row-top', topNums); renderRow('row-bot', botNums); renderSummary(); }

function selectTooth(num) {
  selected = num;
  renderAll();
  const st = STATES[teeth[num]];
  document.getElementById('sel-info').innerHTML =
    `<strong>Pieza ${num}</strong> — <span style="color:${st.color};font-weight:500">${st.label}</span>`;
  const btns = document.getElementById('state-btns');
  btns.style.display = 'flex';
  btns.querySelectorAll('.state-btn').forEach(b => {
    const s = b.dataset.state;
    const active = teeth[num] === s;
    b.className = 'state-btn' + (active ? ' active' : '');
    if (active) { b.style.background = STATES[s].color; b.style.color = '#fff'; }
    else { b.style.background = ''; b.style.color = STATES[s].color; }
  });
}

document.getElementById('state-btns').addEventListener('click', e => {
  const btn = e.target.closest('.state-btn');
  if (!btn || selected === null) return;
  teeth[selected] = btn.dataset.state;
  selectTooth(selected);
  notifyChange({ teeth });
});

function renderSummary() {
  const counts = {};
  Object.keys(STATES).forEach(k => counts[k] = 0);
  Object.values(teeth).forEach(s => { if (counts[s] !== undefined) counts[s]++; });
  const total = Object.keys(teeth).length;
  document.getElementById('summary').innerHTML =
    Object.entries(STATES).map(([k, v]) =>
      `<span class="sum-item"><span class="sum-num" style="color:${v.color}">${counts[k]}</span>${v.label}</span>`
    ).join('') +
    `<span style="font-size:10px;color:var(--color-text-tertiary);margin-left:4px">· ${total} piezas</span>`;
}

renderAll();

function loadState(data) {
  if (data?.teeth) { Object.assign(teeth, data.teeth); renderAll(); }
}
window.getState = function() { return { teeth: teeth }; };

// Theme listener
window.addEventListener('message', function(e) {
  if (e.data?.type === 'artifact:theme' && e.data?.variables) {
    Object.entries(e.data.variables).forEach(([key, val]) => {
      document.documentElement.style.setProperty(key, val);
    });
  }
});
</script>
