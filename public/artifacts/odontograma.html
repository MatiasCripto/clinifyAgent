
<h2 class="sr-only">Odontograma interactivo con 32 piezas dentales seleccionables y estados clínicos</h2>
<style>
.odo-wrap{padding:1rem 0}
.odo-title{font-size:13px;font-weight:500;color:var(--color-text-secondary);margin:0 0 12px;text-align:center}
.odo-row{display:flex;justify-content:center;gap:3px;margin-bottom:4px}
.tooth-wrap{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.tooth-num{font-size:9px;color:var(--color-text-tertiary);line-height:1}
.tooth-svg{width:22px;height:26px;transition:transform 0.1s}
.tooth-wrap:hover .tooth-svg{transform:scale(1.15)}
.legend{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:12px 0}
.leg-item{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--color-text-secondary)}
.leg-dot{width:10px;height:10px;border-radius:50%}
.odo-sep{width:100%;height:0.5px;background:var(--color-border-tertiary);margin:6px 0}
.selected-info{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:10px 14px;margin-top:12px;font-size:13px;color:var(--color-text-secondary);text-align:center;min-height:38px}
.state-btns{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0}
.state-btn{font-size:11px;padding:4px 10px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);color:var(--color-text-secondary);cursor:pointer;transition:all 0.15s}
.state-btn:hover{background:var(--color-background-secondary)}
.state-btn.active{border-color:transparent;color:#fff}
</style>

<div class="odo-wrap">
  <div class="legend">
    <div class="leg-item"><div class="leg-dot" style="background:#B5D4F4"></div>Sano</div>
    <div class="leg-item"><div class="leg-dot" style="background:#F7C1C1"></div>Caries</div>
    <div class="leg-item"><div class="leg-dot" style="background:#FAC775"></div>Obturado</div>
    <div class="leg-item"><div class="leg-dot" style="background:#C0DD97"></div>Corona</div>
    <div class="leg-item"><div class="leg-dot" style="background:#CCC"></div>Ausente</div>
    <div class="leg-item"><div class="leg-dot" style="background:#F4C0D1"></div>Extraer</div>
  </div>

  <div class="odo-title">Superior derecha → Superior izquierda</div>
  <div class="odo-row" id="row-top"></div>
  <div class="odo-sep"></div>
  <div class="odo-row" id="row-bot"></div>
  <div class="odo-title" style="margin-top:4px">Inferior derecha → Inferior izquierda</div>

  <div class="selected-info" id="sel-info">Tocá un diente para ver o modificar su estado</div>

  <div class="state-btns" id="state-btns" style="display:none">
    <button class="state-btn" data-state="sano" style="--c:#185FA5">Sano</button>
    <button class="state-btn" data-state="caries" style="--c:#A32D2D">Caries</button>
    <button class="state-btn" data-state="obturado" style="--c:#854F0B">Obturado</button>
    <button class="state-btn" data-state="corona" style="--c:#3B6D11">Corona</button>
    <button class="state-btn" data-state="ausente" style="--c:#888780">Ausente</button>
    <button class="state-btn" data-state="extraer" style="--c:#993556">Extraer</button>
  </div>
</div>

<script>
const STATES = {
  sano:     {fill:'#B5D4F4', stroke:'#378ADD', label:'Sano',     c:'#185FA5'},
  caries:   {fill:'#F7C1C1', stroke:'#E24B4A', label:'Caries',   c:'#A32D2D'},
  obturado: {fill:'#FAC775', stroke:'#EF9F27', label:'Obturado', c:'#854F0B'},
  corona:   {fill:'#C0DD97', stroke:'#639922', label:'Corona',   c:'#3B6D11'},
  ausente:  {fill:'#D3D1C7', stroke:'#888780', label:'Ausente',  c:'#5F5E5A'},
  extraer:  {fill:'#F4C0D1', stroke:'#D4537E', label:'Extraer',  c:'#993556'},
};

const topNums = [18,17,16,15,14,13,12,11,21,22,23,24,25,26,27,28];
const botNums = [48,47,46,45,44,43,42,41,31,32,33,34,35,36,37,38];

const teeth = {};
topNums.forEach(n => teeth[n] = 'sano');
botNums.forEach(n => teeth[n] = 'sano');

let selected = null;

function toothSVG(num) {
  const st = teeth[num];
  const s = STATES[st];
  const isMolar = [18,17,16,28,27,26,48,47,46,38,37,36].includes(num);
  const isPremolar = [15,14,25,24,45,44,35,34].includes(num);
  
  let shape = '';
  if (st === 'ausente') {
    shape = `<line x1="3" y1="3" x2="19" y2="23" stroke="${s.stroke}" stroke-width="1.5"/>
             <line x1="19" y1="3" x2="3" y2="23" stroke="${s.stroke}" stroke-width="1.5"/>`;
  } else if (isMolar) {
    shape = `<rect x="2" y="3" width="18" height="20" rx="3" fill="${s.fill}" stroke="${s.stroke}" stroke-width="1.2"/>
             <rect x="6" y="7" width="10" height="12" rx="2" fill="${s.stroke}" opacity="0.2"/>`;
  } else if (isPremolar) {
    shape = `<rect x="3" y="4" width="16" height="18" rx="4" fill="${s.fill}" stroke="${s.stroke}" stroke-width="1.2"/>
             <line x1="11" y1="6" x2="11" y2="20" stroke="${s.stroke}" stroke-width="0.8" opacity="0.4"/>`;
  } else {
    shape = `<ellipse cx="11" cy="13" rx="8" ry="10" fill="${s.fill}" stroke="${s.stroke}" stroke-width="1.2"/>`;
  }
  
  const sel = selected === num ? `<rect x="0" y="0" width="22" height="26" rx="4" fill="none" stroke="#7F77DD" stroke-width="2"/>` : '';
  
  return `<svg class="tooth-svg" viewBox="0 0 22 26" xmlns="http://www.w3.org/2000/svg">${shape}${sel}</svg>`;
}

function renderRow(rowId, nums) {
  const row = document.getElementById(rowId);
  row.innerHTML = nums.map(n => `
    <div class="tooth-wrap" data-num="${n}" onclick="selectTooth(${n})">
      <div class="tooth-num">${n}</div>
      ${toothSVG(n)}
    </div>
  `).join('');
}

function renderAll() {
  renderRow('row-top', topNums);
  renderRow('row-bot', botNums);
}

function selectTooth(num) {
  selected = num;
  renderAll();
  const st = STATES[teeth[num]];
  document.getElementById('sel-info').innerHTML = `<strong>Pieza ${num}</strong> — Estado actual: <span style="color:${st.c};font-weight:500">${st.label}</span>`;
  
  const btns = document.getElementById('state-btns');
  btns.style.display = 'flex';
  btns.querySelectorAll('.state-btn').forEach(b => {
    const s = b.dataset.state;
    const active = teeth[num] === s;
    b.className = 'state-btn' + (active ? ' active' : '');
    b.style.background = active ? STATES[s].c : '';
    b.style.borderColor = active ? STATES[s].c : '';
  });
}

document.getElementById('state-btns').addEventListener('click', e => {
  const btn = e.target.closest('.state-btn');
  if (!btn || selected === null) return;
  teeth[selected] = btn.dataset.state;
  selectTooth(selected);
          notifyChange({ teeth });
});

renderAll();
	function loadState(data) {
	  if (data?.teeth) { Object.assign(teeth, data.teeth); renderAll(); }
	}
	window.getState = function() { return { teeth: teeth }; };
</script>
