<h2 class="sr-only">Curva de crecimiento pediátrica OMS con seguimiento de talla y peso por edad</h2>
<style>
.ped-wrap{padding:1rem 0}
.ped-card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:1rem 1.25rem;margin-bottom:10px}
.ped-label{font-size:12px;color:var(--color-text-secondary);margin-bottom:4px}
.input-row{display:flex;gap:10px;margin-bottom:10px}
.input-row>div{flex:1}
.stats-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px}
.stat-box{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:10px 12px}
.stat-label{font-size:11px;color:var(--color-text-secondary);margin-bottom:3px}
.stat-val{font-size:20px;font-weight:500;color:var(--color-text-primary)}
.stat-sub{font-size:11px}
.section-title{font-size:12px;font-weight:500;color:var(--color-text-secondary);margin:14px 0 8px}
.reg-item{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:0.5px solid var(--color-border-tertiary);font-size:12px}
.reg-badge{font-size:10px;padding:2px 8px;border-radius:var(--border-radius-md);color:#fff}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tab{font-size:12px;padding:5px 14px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);color:var(--color-text-secondary);cursor:pointer}
.tab.active{background:var(--color-text-primary);color:var(--color-background-primary);border-color:transparent}
</style>

<div class="ped-wrap">
  <div class="ped-card">
    <div class="input-row">
      <div>
        <div class="ped-label">Sexo</div>
        <select id="sexo" style="width:100%" onchange="evaluar()">
          <option value="M">Masculino</option>
          <option value="F">Femenino</option>
        </select>
      </div>
      <div>
        <div class="ped-label">Edad (meses)</div>
        <input type="number" id="edad" placeholder="24" min="0" max="228" style="width:100%" oninput="evaluar()"/>
      </div>
    </div>
    <div class="input-row">
      <div>
        <div class="ped-label">Talla (cm)</div>
        <input type="number" id="talla" placeholder="86" min="40" max="200" step="0.1" style="width:100%" oninput="evaluar()"/>
      </div>
      <div>
        <div class="ped-label">Peso (kg)</div>
        <input type="number" id="peso" placeholder="12" min="1" max="150" step="0.1" style="width:100%" oninput="evaluar()"/>
      </div>
    </div>
  </div>

  <div id="result-section" style="display:none">
    <div class="stats-grid">
      <div class="stat-box">
        <div class="stat-label">Talla para la edad</div>
        <div class="stat-val" id="talla-zsc">—</div>
        <div class="stat-sub" id="talla-cat" style="font-weight:500">—</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Peso para la edad</div>
        <div class="stat-val" id="peso-zsc">—</div>
        <div class="stat-sub" id="peso-cat" style="font-weight:500">—</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">IMC para la edad</div>
        <div class="stat-val" id="imc-zsc">—</div>
        <div class="stat-sub" id="imc-cat" style="font-weight:500">—</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Percentil estimado</div>
        <div class="stat-val" id="percentil">—</div>
        <div class="stat-sub">talla/edad</div>
      </div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="setTab('talla',this)">Talla</button>
    <button class="tab" onclick="setTab('peso',this)">Peso</button>
  </div>

  <div class="ped-card">
    <div class="ped-label" id="chart-label">Curva de talla (cm)</div>
    <canvas id="ped-chart" height="160"></canvas>
  </div>

  <div class="section-title">Registrar medición</div>
  <div class="ped-card">
    <div class="input-row">
      <div>
        <div class="ped-label">Fecha</div>
        <input type="date" id="fecha-reg" style="width:100%"/>
      </div>
      <div>
        <div class="ped-label">Edad (meses)</div>
        <input type="number" id="reg-edad" placeholder="24" min="0" max="228" style="width:100%"/>
      </div>
    </div>
    <div class="input-row">
      <div>
        <div class="ped-label">Talla (cm)</div>
        <input type="number" id="reg-talla" placeholder="86" step="0.1" style="width:100%"/>
      </div>
      <div>
        <div class="ped-label">Peso (kg)</div>
        <input type="number" id="reg-peso" placeholder="12" step="0.1" style="width:100%"/>
      </div>
    </div>
    <button onclick="addReg()" style="width:100%">Agregar medición</button>
  </div>

  <div id="reg-list"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script>
const registros = [];
let chart = null;
let tabActual = 'talla';

const OMS_TALLA_M = {0:49.9,3:61.4,6:67.6,9:72.3,12:75.7,18:82.3,24:87.8,36:96.1,48:103.3,60:110.0,72:116.0,84:121.7,96:127.3,108:132.6,120:137.5,132:142.1,144:146.6,156:151.0,168:155.2,180:158.7,192:161.3,204:163.2,216:164.7,228:165.3};
const OMS_TALLA_F = {0:49.1,3:59.8,6:65.7,9:70.1,12:74.0,18:80.7,24:86.4,36:95.1,48:102.7,60:109.4,72:115.5,84:121.5,96:127.3,108:133.0,120:138.6,132:144.1,144:149.2,156:153.9,168:157.7,180:160.5,192:162.3,204:163.4,216:164.0,228:164.3};
const OMS_PESO_M = {0:3.3,3:6.4,6:7.9,9:9.2,12:9.6,18:11.1,24:12.2,36:14.3,48:16.3,60:18.3,72:20.5,84:22.9,96:25.4,108:28.1,120:31.2};
const OMS_PESO_F = {0:3.2,3:5.8,6:7.3,9:8.2,12:8.9,18:10.2,24:11.5,36:13.9,48:16.1,60:18.2,72:20.2,84:22.4,96:25.0,108:28.2,120:32.0};

function getRef(tabla, edad) {
  const keys = Object.keys(tabla).map(Number).sort((a,b)=>a-b);
  const lo = keys.filter(k => k <= edad).pop() ?? keys[0];
  const hi = keys.filter(k => k >= edad)[0] ?? keys[keys.length-1];
  if (lo === hi) return tabla[lo];
  const t = (edad - lo) / (hi - lo);
  return tabla[lo] + t * (tabla[hi] - tabla[lo]);
}

function zScore(val, ref, sd) {
  return ((val - ref) / sd).toFixed(2);
}

function zCat(z, tipo) {
  const n = parseFloat(z);
  if (tipo === 'talla') {
    if (n < -3)      return {label:'Talla muy baja', color:'#A32D2D'};
    if (n < -2)      return {label:'Talla baja', color:'#854F0B'};
    if (n < 2)       return {label:'Normal', color:'#3B6D11'};
    return {label:'Talla alta', color:'#185FA5'};
  }
  if (n < -3)        return {label:'Desnutrición severa', color:'#A32D2D'};
  if (n < -2)        return {label:'Bajo peso', color:'#854F0B'};
  if (n < 1)         return {label:'Normal', color:'#3B6D11'};
  if (n < 2)         return {label:'Posible sobrepeso', color:'#854F0B'};
  return {label:'Obesidad', color:'#A32D2D'};
}

function zToPercentil(z) {
  const n = parseFloat(z);
  if (n <= -3) return '<1';
  if (n <= -2) return '2-3';
  if (n <= -1) return '16';
  if (n <= 0)  return '50';
  if (n <= 1)  return '84';
  if (n <= 2)  return '97-98';
  return '>99';
}

function evaluar() {
  const edad = parseInt(document.getElementById('edad').value);
  const talla = parseFloat(document.getElementById('talla').value);
  const peso = parseFloat(document.getElementById('peso').value);
  const sexo = document.getElementById('sexo').value;
  if (!edad && edad !== 0) return;

  const tallaTbl = sexo === 'M' ? OMS_TALLA_M : OMS_TALLA_F;
  const pesoTbl = sexo === 'M' ? OMS_PESO_M : OMS_PESO_F;

  document.getElementById('result-section').style.display = 'block';

  if (talla) {
    const ref = getRef(tallaTbl, edad);
    const z = zScore(talla, ref, ref * 0.06);
    const cat = zCat(z, 'talla');
    document.getElementById('talla-zsc').textContent = `Z: ${z}`;
    document.getElementById('talla-cat').textContent = cat.label;
    document.getElementById('talla-cat').style.color = cat.color;
    document.getElementById('percentil').textContent = zToPercentil(z);
  }
  if (peso) {
    const ref = getRef(pesoTbl, Math.min(edad, 120));
    const z = zScore(peso, ref, ref * 0.12);
    const cat = zCat(z, 'peso');
    document.getElementById('peso-zsc').textContent = `Z: ${z}`;
    document.getElementById('peso-cat').textContent = cat.label;
    document.getElementById('peso-cat').style.color = cat.color;
  }
  if (talla && peso) {
    const imc = peso / ((talla/100)**2);
    const imcRef = 16 + (edad/228) * 2;
    const z = zScore(imc, imcRef, imcRef * 0.1);
    const cat = zCat(z, 'imc');
    document.getElementById('imc-zsc').textContent = imc.toFixed(1);
    document.getElementById('imc-cat').textContent = cat.label;
    document.getElementById('imc-cat').style.color = cat.color;
  }
  renderChart();
}

function setTab(tab, el) {
  tabActual = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('chart-label').textContent = tab === 'talla' ? 'Curva de talla (cm)' : 'Curva de peso (kg)';
  renderChart();
}

function renderChart() {
  const sexo = document.getElementById('sexo').value;
  const tbl = tabActual === 'talla'
    ? (sexo === 'M' ? OMS_TALLA_M : OMS_TALLA_F)
    : (sexo === 'M' ? OMS_PESO_M : OMS_PESO_F);

  const maxEdad = tabActual === 'talla' ? 228 : 120;
  const refKeys = Object.keys(tbl).map(Number).filter(k => k <= maxEdad).sort((a,b)=>a-b);
  const refLabels = refKeys.map(k => k + 'm');
  const refData = refKeys.map(k => tbl[k]);

  const puntos = registros.filter(r => r.edad <= maxEdad).map(r => ({
    x: r.edad,
    y: tabActual === 'talla' ? r.talla : r.peso
  })).filter(p => p.y);

  if (chart) chart.destroy();
  const ctx = document.getElementById('ped-chart').getContext('2d');
  chart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: refLabels,
      datasets: [
        {
          label: 'Referencia OMS P50',
          data: refData,
          borderColor: 'rgba(99,153,34,0.5)',
          borderWidth: 1.5,
          borderDash: [4,3],
          pointRadius: 0,
          fill: false,
          tension: 0.3,
        },
        {
          label: 'Paciente',
          data: puntos,
          borderColor: '#378ADD',
          backgroundColor: 'rgba(55,138,221,0.1)',
          borderWidth: 2,
          pointRadius: 5,
          pointBackgroundColor: '#378ADD',
          fill: false,
          tension: 0.3,
          parsing: { xAxisKey: 'x', yAxisKey: 'y' },
          showLine: true,
        }
      ]
    },
    options: {
      responsive: true,
      plugins: { legend: { labels: { font: { size: 11 }, boxWidth: 16 } } },
      scales: {
        x: { grid: { display: false }, ticks: { font: { size: 10 } } },
        y: { grid: { color: 'rgba(128,128,128,0.1)' }, ticks: { font: { size: 11 } } }
      }
    }
  });
}

function addReg() {
  const fecha = document.getElementById('fecha-reg').value;
  const edad = parseInt(document.getElementById('reg-edad').value);
  const talla = parseFloat(document.getElementById('reg-talla').value);
  const peso = parseFloat(document.getElementById('reg-peso').value);
  if (!fecha || (!edad && edad !== 0)) return;

  const [y,m,d] = fecha.split('-');
  registros.push({ fecha, label: `${d}/${m}/${y.slice(2)}`, edad, talla, peso });
  registros.sort((a,b) => a.fecha.localeCompare(b.fecha));

  document.getElementById('reg-edad').value = '';
  document.getElementById('reg-talla').value = '';
  document.getElementById('reg-peso').value = '';
  renderChart();
  renderRegList();
}

function renderRegList() {
  const list = document.getElementById('reg-list');
  if (!registros.length) { list.innerHTML = ''; return; }
  list.innerHTML = '<div style="font-size:12px;font-weight:500;color:var(--color-text-secondary);margin:10px 0 6px">Mediciones registradas</div>' +
    registros.slice().reverse().map(r =>
      `<div class="reg-item">
        <span>${r.label} · ${r.edad}m</span>
        <span>${r.talla ? r.talla+'cm' : ''} ${r.peso ? r.peso+'kg' : ''}</span>
      </div>`
    ).join('');
}

function loadState(data) {
  if (data?.sexo) document.getElementById('sexo').value = data.sexo;
  if (data?.edad !== undefined) document.getElementById('edad').value = data.edad;
  if (data?.talla) document.getElementById('talla').value = data.talla;
  if (data?.peso) document.getElementById('peso').value = data.peso;
  if (data?.registros) {
    data.registros.forEach(r => registros.push(r));
    renderRegList();
  }
  if (data?.edad !== undefined || data?.talla || data?.peso) evaluar();
}
window.getState = function() {
  return {
    sexo: document.getElementById('sexo').value,
    edad: document.getElementById('edad').value,
    talla: document.getElementById('talla').value,
    peso: document.getElementById('peso').value,
    registros: registros
  };
};

document.getElementById('fecha-reg').valueAsDate = new Date();
renderChart();
</script>
