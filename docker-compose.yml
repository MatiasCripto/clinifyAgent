version: '3.8'

# OdontoCare — Self-hosted infrastructure
# Services: n8n (automation), Evolution API (WhatsApp), PostgreSQL (n8n DB), Redis (Evolution)
#
# Usage:
#   cp .env.example .env        # fill all values first
#   docker compose up -d
#   docker compose logs -f      # tail logs

volumes:
  postgres_data:
  n8n_data:
  evolution_data:
  redis_data:

networks:
  odontocare:
    driver: bridge

services:

  # ──────────────────────────────────────────
  # PostgreSQL — n8n metadata store
  # ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: oc_postgres
    restart: unless-stopped
    networks: [odontocare]
    environment:
      POSTGRES_DB:       ${N8N_DB_POSTGRESDB_DATABASE:-n8n}
      POSTGRES_USER:     ${N8N_DB_POSTGRESDB_USER:-n8n}
      POSTGRES_PASSWORD: ${N8N_DB_POSTGRESDB_PASSWORD:?err}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${N8N_DB_POSTGRESDB_USER:-n8n}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────
  # Redis — Evolution API message queue & cache
  # ──────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: oc_redis
    restart: unless-stopped
    networks: [odontocare]
    command: redis-server --requirepass ${REDIS_PASSWORD:-redispass} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:-redispass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────
  # n8n — Workflow automation engine
  # Runs at http://localhost:5678
  # ──────────────────────────────────────────
  n8n:
    image: n8nio/n8n:latest
    container_name: oc_n8n
    restart: unless-stopped
    networks: [odontocare]
    ports:
      - "5678:5678"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Database
      DB_TYPE:                    postgresdb
      DB_POSTGRESDB_HOST:         postgres
      DB_POSTGRESDB_PORT:         5432
      DB_POSTGRESDB_DATABASE:     ${N8N_DB_POSTGRESDB_DATABASE:-n8n}
      DB_POSTGRESDB_USER:         ${N8N_DB_POSTGRESDB_USER:-n8n}
      DB_POSTGRESDB_PASSWORD:     ${N8N_DB_POSTGRESDB_PASSWORD:?err}
      # Instance
      N8N_HOST:                   ${N8N_HOST:-localhost}
      N8N_PORT:                   5678
      N8N_PROTOCOL:               ${N8N_PROTOCOL:-http}
      WEBHOOK_URL:                ${N8N_WEBHOOK_URL:-http://localhost:5678/}
      N8N_ENCRYPTION_KEY:         ${N8N_ENCRYPTION_KEY:?err}
      # Auth
      N8N_BASIC_AUTH_ACTIVE:      true
      N8N_BASIC_AUTH_USER:        ${N8N_BASIC_AUTH_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD:    ${N8N_BASIC_AUTH_PASSWORD:?err}
      # Execution
      EXECUTIONS_MODE:            queue
      QUEUE_BULL_REDIS_HOST:      redis
      QUEUE_BULL_REDIS_PORT:      6379
      QUEUE_BULL_REDIS_PASSWORD:  ${REDIS_PASSWORD:-redispass}
      EXECUTIONS_DATA_PRUNE:      true
      EXECUTIONS_DATA_MAX_AGE:    168       # 7 days in hours
      # Timezone
      GENERIC_TIMEZONE:           ${TIMEZONE:-America/Argentina/Cordoba}
      TZ:                         ${TIMEZONE:-America/Argentina/Cordoba}
    volumes:
      - n8n_data:/home/node/.n8n
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ──────────────────────────────────────────
  # n8n worker — processes queued executions
  # ──────────────────────────────────────────
  n8n_worker:
    image: n8nio/n8n:latest
    container_name: oc_n8n_worker
    restart: unless-stopped
    networks: [odontocare]
    depends_on:
      n8n:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: worker
    environment:
      DB_TYPE:                    postgresdb
      DB_POSTGRESDB_HOST:         postgres
      DB_POSTGRESDB_PORT:         5432
      DB_POSTGRESDB_DATABASE:     ${N8N_DB_POSTGRESDB_DATABASE:-n8n}
      DB_POSTGRESDB_USER:         ${N8N_DB_POSTGRESDB_USER:-n8n}
      DB_POSTGRESDB_PASSWORD:     ${N8N_DB_POSTGRESDB_PASSWORD:?err}
      N8N_ENCRYPTION_KEY:         ${N8N_ENCRYPTION_KEY:?err}
      EXECUTIONS_MODE:            queue
      QUEUE_BULL_REDIS_HOST:      redis
      QUEUE_BULL_REDIS_PORT:      6379
      QUEUE_BULL_REDIS_PASSWORD:  ${REDIS_PASSWORD:-redispass}
      GENERIC_TIMEZONE:           ${TIMEZONE:-America/Argentina/Cordoba}
      TZ:                         ${TIMEZONE:-America/Argentina/Cordoba}
    volumes:
      - n8n_data:/home/node/.n8n

  # ──────────────────────────────────────────
  # Evolution API — WhatsApp gateway
  # Runs at http://localhost:8080
  # ──────────────────────────────────────────
  evolution:
    image: atendai/evolution-api:latest
    container_name: oc_evolution
    restart: unless-stopped
    networks: [odontocare]
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      SERVER_URL:               ${EVOLUTION_API_URL:-http://localhost:8080}
      # Authentication
      AUTHENTICATION_TYPE:      apikey
      AUTHENTICATION_API_KEY:   ${EVOLUTION_API_KEY:?err}
      # Redis
      CACHE_REDIS_ENABLED:      true
      CACHE_REDIS_URI:          redis://:${REDIS_PASSWORD:-redispass}@redis:6379/6
      CACHE_REDIS_PREFIX_KEY:   evolution
      # Storage — use local for simplicity
      STORAGE_TYPE:             local
      # Webhook defaults (each instance overrides)
      WEBHOOK_GLOBAL_URL:       ${NEXT_PUBLIC_APP_URL:-http://host.docker.internal:3000}/api/webhooks/whatsapp
      WEBHOOK_GLOBAL_ENABLED:   false
      WEBHOOK_EVENTS_MESSAGES_UPSERT: true
      WEBHOOK_EVENTS_SEND_MESSAGE:    false
      # Logs
      LOG_LEVEL:                ERROR,WARN
      # Timezone
      TZ:                       ${TIMEZONE:-America/Argentina/Cordoba}
    volumes:
      - evolution_data:/evolution/instances
